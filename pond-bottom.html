<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Pond Bottom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --ink: #10301f;
      --soft: #4b6b57;
      --frame-border: #9cc7a6;
      --gas: #d6456a;
      --shrimp-label: #17707d;
      --interface-label: #7a5a2f;
      --sand-line: #c58f4a;
      --sediment-label: #d9a566;
      --settling: #9a6c3e;
      --mint: #a8ecc7;
    }

    html, body {
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 18px;
      line-height: 1.7;
      color: var(--ink);
      background: radial-gradient(ellipse at 60% 30%, #e3f2dd 0%, #d3ebcc 100%);
      background-attachment: fixed;
      padding: 0;
      position: relative;
    }

    /* ── Floating ring bubbles ── */
    .bubbles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .bubble {
      position: absolute;
      bottom: -120px;
      border-radius: 50%;
      border: 1.5px solid rgba(100,185,120,0.28);
      background: transparent;
      animation: bubbleFloat linear infinite;
    }

    @keyframes bubbleFloat {
      0%   { transform: translateX(0) translateY(0); opacity: 0; }
      8%   { opacity: 1; }
      85%  { opacity: .7; }
      100% { transform: translateX(var(--drift)) translateY(-110vh); opacity: 0; }
    }

    /* ── Page wrapper ── */
    .page {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: clamp(48px, 8vw, 96px) clamp(24px, 5vw, 64px) clamp(64px, 10vw, 120px);
    }

    /* ── Eyebrow ── */
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: clamp(24px, 3.5vw, 40px);
      overflow: hidden;
    }
    .eyebrow-line {
      height: 1px;
      width: 28px;
      background: var(--ink);
      transform-origin: left center;
      transform: scaleX(0);
      animation: lineGrow .7s cubic-bezier(.16,1,.3,1) .1s forwards;
    }
    .eyebrow-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--soft);
    }

    @keyframes lineGrow {
      to { transform: scaleX(1); }
    }

    /* ── Headline ── */
    .headline-wrap { overflow: hidden; }
    .headline-wrap + .headline-wrap { margin-top: .06em; }

    h1 {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 800;
      font-size: clamp(44px, 7.2vw, 92px);
      line-height: .98;
      letter-spacing: -0.035em;
      color: var(--ink);
      display: block;
      transform: translateY(110%);
      animation: slideUp 1.1s cubic-bezier(.16,1,.3,1) forwards;
    }
    .headline-wrap:nth-child(2) h1 { animation-delay: .14s; }

    @keyframes slideUp {
      to { transform: translateY(0); }
    }

    /* ── Body paragraph ── */
    .intro {
      margin-top: clamp(22px, 3vw, 36px);
      max-width: 41em;
      font-family: 'Newsreader', Georgia, serif;
      font-size: clamp(15px, 1.1vw + 11px, 18px);
      line-height: 1.7;
      color: var(--soft);
      opacity: 0;
      animation: fadeIn .7s ease forwards;
      animation-delay: .55s;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* ── Diagram frame ── */
    .diagram-frame {
      margin-top: clamp(32px, 5vw, 60px);
      border: 1px solid var(--frame-border);
      border-radius: 3px;
      padding: clamp(20px, 3.5vw, 44px);
      background: rgba(255,255,255,0.38);
      opacity: 0;
      transform: translateY(24px);
      animation: frameRise .8s cubic-bezier(.16,1,.3,1) .8s forwards;
    }

    @keyframes frameRise {
      to { opacity: 1; transform: translateY(0); }
    }

    .diagram-frame svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ── SVG animation classes ── */

    /* Sand interface line draw */
    .sand-line {
      stroke-dasharray: 1300;
      stroke-dashoffset: 1300;
    }
    .sand-line.animate {
      animation: drawLine 2s cubic-bezier(.4,0,.2,1) forwards;
    }
    @keyframes drawLine {
      to { stroke-dashoffset: 0; }
    }

    /* Labels fade in */
    .lbl { opacity: 0; }
    .lbl.animate { animation: fadeIn .6s ease forwards; }

    /* Pink arrows scale up from bottom */
    .arrow-group { transform-origin: center bottom; }
    .arrow-shaft { opacity: 0; transform-origin: center bottom; transform: scaleY(0); }
    .arrow-shaft.animate { animation: arrowRise 1.6s cubic-bezier(.16,1,.3,1) forwards; }
    @keyframes arrowRise {
      to { opacity: 1; transform: scaleY(1); }
    }

    .arrow-head { opacity: 0; }
    .arrow-head.animate { animation: fadeIn .4s ease forwards; }

    /* Arrow head bob */
    .arrow-head.bob { animation: headBob 2.2s ease-in-out infinite; }
    @keyframes headBob {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-4px); }
    }

    /* Flowing dashes on arrow shafts */
    .arrow-dash { stroke-dasharray: 8 6; animation: flowUp 1.4s linear infinite; }
    @keyframes flowUp {
      to { stroke-dashoffset: -28; }
    }

    /* Sediment labels slide up */
    .sed-lbl { opacity: 0; transform: translateY(8px); }
    .sed-lbl.animate { animation: sedSlide .7s cubic-bezier(.16,1,.3,1) forwards; }
    @keyframes sedSlide {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Falling particles */
    .particle { animation: particleFall var(--dur, 3s) var(--del, 0s) linear infinite; }
    @keyframes particleFall {
      0%   { transform: translateY(0);   opacity: .8; }
      80%  { opacity: .6; }
      100% { transform: translateY(var(--drop, 100px)); opacity: 0; }
    }

    /* Microbe drift */
    .microbe { animation: microbeDrift var(--md, 6s) var(--mde, 0s) ease-in-out infinite alternate; }
    @keyframes microbeDrift {
      from { transform: translateX(0); }
      to   { transform: translateX(var(--mx, 10px)); }
    }

    /* Sediment crust pulse */
    .crust { animation: crustBob 3.4s ease-in-out infinite; }
    @keyframes crustBob {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-3px); }
    }

    /* Rising gas dots */
    .gas-dot { animation: gasDotRise var(--gd, 2s) var(--gde, 0s) ease-in infinite; }
    @keyframes gasDotRise {
      0%   { transform: translateY(0); opacity: .9; }
      100% { transform: translateY(-130px); opacity: 0; }
    }

    /* ── Reduced motion: kill everything ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        transform: none !important;
        opacity: 1 !important;
        stroke-dashoffset: 0 !important;
      }
      .sand-line { stroke-dashoffset: 0; }
      .arrow-shaft { opacity: 1; transform: scaleY(1); }
      .arrow-head { opacity: 1; }
      .sed-lbl { opacity: 1; transform: translateY(0); }
      .lbl { opacity: 1; }
      .bubble { display: none; }
    }
  </style>
</head>
<body>

<!-- Floating ring bubbles -->
<div class="bubbles" aria-hidden="true" id="bubbles"></div>

<div class="page">

  <!-- Eyebrow -->
  <div class="eyebrow">
    <div class="eyebrow-line"></div>
    <span class="eyebrow-text">The Pond Bottom</span>
  </div>

  <!-- Headline (two lines, each in overflow mask) -->
  <div class="headline-wrap"><h1>Where organic load</h1></div>
  <div class="headline-wrap"><h1>turns into toxic gas.</h1></div>

  <!-- Intro paragraph -->
  <p class="intro">
    Uneaten feed, faeces and dead plankton settle on the bottom every day. Just below the surface
    of that sludge there is no oxygen, and microbes break it down anaerobically. The by-products
    seep up into the water where the shrimp live.
  </p>

  <!-- Bordered frame with SVG diagram -->
  <div class="diagram-frame" id="diagram-frame">
    <svg viewBox="0 0 1092 438" xmlns="http://www.w3.org/2000/svg"
         role="img" aria-label="Cross-section diagram of a pond bottom showing organic load settling through the water column into anaerobic sediment and toxic gases rising back up">

      <defs>
        <!-- Water gradient -->
        <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#e2f3ef"/>
          <stop offset="100%" stop-color="#bfe2dd"/>
        </linearGradient>

        <!-- Sediment gradient -->
        <linearGradient id="sedGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#3a2a1d"/>
          <stop offset="100%" stop-color="#271b13"/>
        </linearGradient>

        <!-- Sand interface gradient (thin band) -->
        <linearGradient id="sandBand" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#d4a85a" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#b87c30" stop-opacity=".3"/>
        </linearGradient>

        <!-- Gas / pink arrow marker -->
        <marker id="gasArrow" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
          <path d="M0 0 L9 4.5 L0 9 Z" fill="#d6456a"/>
        </marker>
      </defs>

      <!-- ════════════════════════════════════
           WATER COLUMN
      ════════════════════════════════════ -->
      <rect x="0" y="0" width="1092" height="220" fill="url(#waterGrad)"/>

      <!-- Water column label -->
      <text class="lbl" id="lbl-water"
            x="50" y="34"
            font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500"
            fill="#17707d" letter-spacing=".14em" text-anchor="start">
        WATER COLUMN · SHRIMP
      </text>

      <!-- ════════════════════════════════════
           SAND INTERFACE BAND
      ════════════════════════════════════ -->
      <!-- Thin oxidised band -->
      <rect x="0" y="218" width="1092" height="14" fill="url(#sandBand)"/>

      <!-- The wavy sand-coloured interface line (animated draw) -->
      <!-- Path follows a gentle wave across the full width at y≈220 -->
      <path class="sand-line" id="sand-line"
            d="M0,222 C60,218 120,226 180,222 C240,218 300,226 360,222 C420,218 480,226 540,222 C600,218 660,226 720,222 C780,218 840,226 900,222 C960,218 1020,226 1092,222"
            stroke="#c58f4a" stroke-width="2.5" fill="none"/>

      <!-- Thin dotted line just below the sand line -->
      <line class="lbl" id="lbl-dotted"
            x1="0" y1="234" x2="1092" y2="234"
            stroke="#c58f4a" stroke-width="1" stroke-dasharray="4 5" opacity=".45"/>

      <!-- Interface label -->
      <text class="lbl" id="lbl-interface"
            x="50" y="214"
            font-family="'JetBrains Mono', monospace" font-size="11" font-weight="400"
            fill="#7a5a2f" letter-spacing=".14em" text-anchor="start">
        SOIL-WATER INTERFACE · THIN OXIDISED LAYER
      </text>

      <!-- ════════════════════════════════════
           ANAEROBIC SEDIMENT
      ════════════════════════════════════ -->
      <rect x="0" y="232" width="1092" height="206" fill="url(#sedGrad)"/>

      <!-- Sediment crust texture strip (animates up/down) -->
      <g class="crust">
        <rect x="0" y="232" width="1092" height="8" fill="#4a3322" opacity=".7"/>
      </g>

      <!-- Sediment section label -->
      <text class="lbl" id="lbl-sed"
            x="50" y="260"
            font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500"
            fill="#d9a566" letter-spacing=".14em" text-anchor="start">
        ANAEROBIC SEDIMENT · NO OXYGEN
      </text>

      <!-- ════════════════════════════════════
           FALLING PARTICLES (top-left)
      ════════════════════════════════════ -->
      <!-- 14 small brown dots with staggered random animation -->
      <!-- Group wraps them so they start from ~y=20 and fall toward y=220 -->
      <g id="particles">
        <!-- r≈3, fill=#9a6c3e, x spread 60–195, each has unique dur/del/drop -->
        <circle class="particle" cx="68"  cy="44"  r="3" fill="#9a6c3e" style="--dur:2.8s;--del:-0.4s;--drop:160px"/>
        <circle class="particle" cx="88"  cy="62"  r="2.5" fill="#9a6c3e" style="--dur:3.3s;--del:-1.1s;--drop:150px"/>
        <circle class="particle" cx="76"  cy="30"  r="3.5" fill="#9a6c3e" style="--dur:2.6s;--del:-2.0s;--drop:170px"/>
        <circle class="particle" cx="105" cy="52"  r="2"   fill="#9a6c3e" style="--dur:3.8s;--del:-0.7s;--drop:155px"/>
        <circle class="particle" cx="118" cy="38"  r="3"   fill="#9a6c3e" style="--dur:3.1s;--del:-1.5s;--drop:162px"/>
        <circle class="particle" cx="132" cy="66"  r="2.5" fill="#9a6c3e" style="--dur:2.9s;--del:-0.2s;--drop:148px"/>
        <circle class="particle" cx="145" cy="28"  r="3"   fill="#9a6c3e" style="--dur:3.5s;--del:-1.8s;--drop:170px"/>
        <circle class="particle" cx="158" cy="54"  r="2"   fill="#9a6c3e" style="--dur:2.7s;--del:-0.9s;--drop:158px"/>
        <circle class="particle" cx="80"  cy="82"  r="3.5" fill="#9a6c3e" style="--dur:3.0s;--del:-2.3s;--drop:132px"/>
        <circle class="particle" cx="100" cy="76"  r="2.5" fill="#9a6c3e" style="--dur:3.6s;--del:-1.2s;--drop:140px"/>
        <circle class="particle" cx="170" cy="44"  r="3"   fill="#9a6c3e" style="--dur:2.8s;--del:-0.5s;--drop:165px"/>
        <circle class="particle" cx="140" cy="86"  r="2"   fill="#9a6c3e" style="--dur:3.2s;--del:-1.6s;--drop:128px"/>
        <circle class="particle" cx="92"  cy="100" r="3.5" fill="#9a6c3e" style="--dur:2.5s;--del:-0.8s;--drop:118px"/>
        <circle class="particle" cx="160" cy="70"  r="2.5" fill="#9a6c3e" style="--dur:3.4s;--del:-2.1s;--drop:142px"/>
      </g>

      <!-- Particle annotation text -->
      <text class="lbl" id="lbl-particles1"
            x="58" y="142"
            font-family="'Newsreader', Georgia, serif" font-size="13" font-style="italic"
            fill="#4b6b57" opacity=".9">Feed, faeces, dead plankton</text>
      <text class="lbl" id="lbl-particles2"
            x="58" y="160"
            font-family="'Newsreader', Georgia, serif" font-size="13" font-style="italic"
            fill="#4b6b57" opacity=".9">settle daily</text>

      <!-- ════════════════════════════════════
           GAS ARROWS (x=460, 600, 738)
           Arrow 3 (x=738) is tallest
      ════════════════════════════════════ -->

      <!-- Arrow 1 — NH₃ · ammonia  (x=460, shorter) -->
      <g id="arrow1-group">
        <!-- Shaft with transform-origin at bottom for scaleY animation -->
        <line class="arrow-shaft" id="arrow1-shaft"
              x1="460" y1="232" x2="460" y2="110"
              stroke="#d6456a" stroke-width="2.5"
              style="transform-origin: 460px 232px;"/>
        <!-- Flowing dashes overlay -->
        <line class="arrow-dash" id="arrow1-dash"
              x1="460" y1="232" x2="460" y2="110"
              stroke="#d6456a" stroke-width="2.5" opacity=".5"
              stroke-dashoffset="0"
              style="clip-path:none;"/>
        <!-- Arrowhead (bobs after animate) -->
        <polygon class="arrow-head" id="arrow1-head"
                 points="453,112 460,96 467,112"
                 fill="#d6456a"/>
        <!-- Gas dots rising along arrow 1 -->
        <circle class="gas-dot" cx="460" cy="220" r="3.5" fill="#d6456a" opacity=".8" style="--gd:2.1s;--gde:0s"/>
        <circle class="gas-dot" cx="460" cy="200" r="2.5" fill="#d6456a" opacity=".7" style="--gd:2.1s;--gde:-0.7s"/>
        <circle class="gas-dot" cx="460" cy="180" r="2"   fill="#d6456a" opacity=".6" style="--gd:2.1s;--gde:-1.4s"/>
      </g>

      <!-- Arrow 2 — NO₂⁻ · nitrite  (x=600, medium) -->
      <g id="arrow2-group">
        <line class="arrow-shaft" id="arrow2-shaft"
              x1="600" y1="232" x2="600" y2="85"
              stroke="#d6456a" stroke-width="2.5"
              style="transform-origin: 600px 232px;"/>
        <line class="arrow-dash" id="arrow2-dash"
              x1="600" y1="232" x2="600" y2="85"
              stroke="#d6456a" stroke-width="2.5" opacity=".5"
              stroke-dashoffset="0"/>
        <polygon class="arrow-head" id="arrow2-head"
                 points="593,87 600,70 607,87"
                 fill="#d6456a"/>
        <circle class="gas-dot" cx="600" cy="220" r="3.5" fill="#d6456a" opacity=".8" style="--gd:2.3s;--gde:-0.3s"/>
        <circle class="gas-dot" cx="600" cy="198" r="2.5" fill="#d6456a" opacity=".7" style="--gd:2.3s;--gde:-1.0s"/>
        <circle class="gas-dot" cx="600" cy="175" r="2"   fill="#d6456a" opacity=".6" style="--gd:2.3s;--gde:-1.8s"/>
      </g>

      <!-- Arrow 3 — H₂S · hydrogen sulphide  (x=738, tallest) -->
      <g id="arrow3-group">
        <line class="arrow-shaft" id="arrow3-shaft"
              x1="738" y1="232" x2="738" y2="54"
              stroke="#d6456a" stroke-width="2.5"
              style="transform-origin: 738px 232px;"/>
        <line class="arrow-dash" id="arrow3-dash"
              x1="738" y1="232" x2="738" y2="54"
              stroke="#d6456a" stroke-width="2.5" opacity=".5"
              stroke-dashoffset="0"/>
        <polygon class="arrow-head" id="arrow3-head"
                 points="731,56 738,40 745,56"
                 fill="#d6456a"/>
        <circle class="gas-dot" cx="738" cy="220" r="3.5" fill="#d6456a" opacity=".8" style="--gd:2.5s;--gde:-0.5s"/>
        <circle class="gas-dot" cx="738" cy="196" r="2.5" fill="#d6456a" opacity=".7" style="--gd:2.5s;--gde:-1.2s"/>
        <circle class="gas-dot" cx="738" cy="170" r="2"   fill="#d6456a" opacity=".6" style="--gd:2.5s;--gde:-2.0s"/>
      </g>

      <!-- Arrow labels -->
      <text class="lbl" id="lbl-a1"
            x="468" y="106"
            font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="400"
            fill="#d6456a" letter-spacing=".10em">NH₃ · ammonia</text>
      <text class="lbl" id="lbl-a2"
            x="608" y="81"
            font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="400"
            fill="#d6456a" letter-spacing=".10em">NO₂⁻ · nitrite</text>
      <text class="lbl" id="lbl-a3"
            x="746" y="50"
            font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="400"
            fill="#d6456a" letter-spacing=".10em">H₂S · hydrogen sulphide</text>

      <!-- ════════════════════════════════════
           WHITE SERIF LABELS IN SEDIMENT
      ════════════════════════════════════ -->
      <text class="sed-lbl" id="sed1"
            x="300" y="310"
            font-family="'Newsreader', Georgia, serif" font-size="14" font-style="italic"
            fill="rgba(255,255,255,0.88)" text-anchor="middle">
        Organic N → ammonia
      </text>
      <text class="sed-lbl" id="sed2"
            x="570" y="340"
            font-family="'Newsreader', Georgia, serif" font-size="14" font-style="italic"
            fill="rgba(255,255,255,0.88)" text-anchor="middle">
        Incomplete nitrification
      </text>
      <text class="sed-lbl" id="sed3"
            x="820" y="310"
            font-family="'Newsreader', Georgia, serif" font-size="14" font-style="italic"
            fill="rgba(255,255,255,0.88)" text-anchor="middle">
        Sulphate-reducing bacteria
      </text>

      <!-- ════════════════════════════════════
           MICROBES — BOTTOM LEFT (Anaerobic consortia)
      ════════════════════════════════════ -->
      <!-- Pill shapes and circles, mint outline -->
      <g id="microbes-left" style="--mx:8px;--md:5.5s;--mde:0s">
        <!-- pills -->
        <rect class="microbe" x="52" y="348" width="24" height="14" rx="7" ry="7"
              fill="none" stroke="#a8ecc7" stroke-width="1.8" style="--mx:8px;--md:5.5s;--mde:0s"/>
        <rect class="microbe" x="82" y="360" width="18" height="11" rx="5.5" ry="5.5"
              fill="none" stroke="#a8ecc7" stroke-width="1.6" style="--mx:7px;--md:6.8s;--mde:-0.9s"/>
        <rect class="microbe" x="66" y="372" width="22" height="12" rx="6" ry="6"
              fill="none" stroke="#a8ecc7" stroke-width="1.7" style="--mx:9px;--md:5.0s;--mde:-1.4s"/>
        <!-- circles -->
        <circle class="microbe" cx="112" cy="355" r="7"
                fill="none" stroke="#a8ecc7" stroke-width="1.7" style="--mx:6px;--md:7.2s;--mde:-0.4s"/>
        <circle class="microbe" cx="100" cy="376" r="5.5"
                fill="none" stroke="#a8ecc7" stroke-width="1.6" style="--mx:10px;--md:6.0s;--mde:-1.8s"/>
        <circle class="microbe" cx="50"  cy="370" r="6"
                fill="none" stroke="#a8ecc7" stroke-width="1.6" style="--mx:5px;--md:7.5s;--mde:-0.6s"/>
        <!-- label -->
        <text class="lbl" id="lbl-microbe-left1"
              x="52" y="404"
              font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="400"
              fill="#a8ecc7" letter-spacing=".12em" text-transform="uppercase">
          ANAEROBIC CONSORTIA
        </text>

<script>
(function () {
  'use strict';

  // ── Floating ring bubbles ──────────────────────────────────────────────────
  const bubbleContainer = document.getElementById('bubbles');
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!prefersReduced) {
    for (let i = 0; i < 22; i++) {
      const b = document.createElement('div');
      b.className = 'bubble';
      const size = 18 + Math.random() * 70;          // 18–88 px
      const startX = Math.random() * 100;            // % left
      const drift = (Math.random() - 0.5) * 160;    // px sideways
      const dur = 8 + Math.random() * 14;            // 8–22 s
      const del = -(Math.random() * dur);            // negative so they start mid-flight
      b.style.cssText = `
        left: ${startX}%;
        width: ${size}px;
        height: ${size}px;
        --drift: ${drift}px;
        animation-duration: ${dur}s;
        animation-delay: ${del}s;
      `;
      bubbleContainer.appendChild(b);
    }
  }

  // ── Diagram IntersectionObserver ──────────────────────────────────────────
  if (prefersReduced) return; // reduced-motion: CSS already shows final state

  const frame = document.getElementById('diagram-frame');

  const observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (!entry.isIntersecting) return;
      observer.disconnect();

      const BASE_DELAY = 900; // ms — start after 0.9 s

      // Helper: apply animation after delay + extra offset
      function animateAfter(el, cls, extraMs) {
        if (!el) return;
        setTimeout(function () { el.classList.add(cls); }, BASE_DELAY + extraMs);
      }

      // ── 1. Sand line draws over 2 s ─────────────────────────────
      animateAfter(document.getElementById('sand-line'), 'animate', 0);

      // ── 2. Labels fade in with stagger ──────────────────────────
      var lblDelay = 400; // after line starts drawing
      [
        'lbl-water', 'lbl-interface', 'lbl-dotted', 'lbl-sed',
        'lbl-particles1', 'lbl-particles2',
        'lbl-microbe-left1', 'lbl-microbe-left2',
        'lbl-microbe-right1', 'lbl-microbe-right2'
      ].forEach(function (id, i) {
        animateAfter(document.getElementById(id), 'animate', lblDelay + i * 90);
      });

      // ── 3. Pink arrows grow upward, staggered 0.3 s each ────────
      var arrowBase = 2200; // after line finishes drawing
      ['arrow1-shaft', 'arrow2-shaft', 'arrow3-shaft'].forEach(function (id, i) {
        animateAfter(document.getElementById(id), 'animate', arrowBase + i * 300);
      });

      // ── 4. Arrow labels fade in after their shaft ────────────────
      [['lbl-a1', 300], ['lbl-a2', 600], ['lbl-a3', 900]].forEach(function (pair) {
        animateAfter(document.getElementById(pair[0]), 'animate', arrowBase + pair[1] + 800);
      });

      // Arrowheads appear + start bobbing
      [['arrow1-head', 300], ['arrow2-head', 600], ['arrow3-head', 900]].forEach(function (pair) {
        var el = document.getElementById(pair[0]);
        if (!el) return;
        setTimeout(function () {
          el.classList.add('animate');
          setTimeout(function () {
            el.classList.remove('animate');
            el.style.opacity = '1';
            el.classList.add('bob');
          }, 400);
        }, BASE_DELAY + arrowBase + pair[1]);
      });

      // ── 5. Sediment labels slide up ───────────────────────────────
      var sedBase = arrowBase + 1400;
      ['sed1', 'sed2', 'sed3'].forEach(function (id, i) {
        animateAfter(document.getElementById(id), 'animate', sedBase + i * 180);
      });
    });
  }, { threshold: 0.25 });

  observer.observe(frame);
}());
</script>
