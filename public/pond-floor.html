<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inside the pond floor: where toxins are born</title>
<style>
/* ── CSS variables: light / dark ── */
:root {
  --page-bg: #f0f7e8;
  --card-bg: #f6fbf0;
  --card-shadow: none;
  --title-color: #1f4d38;
  --ctrl-bg: #e6f2d9;
  --ctrl-border: #c8ddb0;
  --label-color: #2a5c1a;
  --caption-color: #2a5c1a;
  --slider-accent: #2f8f4e;
  --btn-bg: #1f4d38;
  --btn-color: #f0f7e8;
  --meter-border: #a8cc90;
}
@media(prefers-color-scheme:dark){
  :root {
    --page-bg: #f0f7e8;
    --card-bg: #f6fbf0;
    --card-shadow: none;
    --title-color: #1f4d38;
    --ctrl-bg: #e6f2d9;
    --ctrl-border: #c8ddb0;
    --label-color: #2a5c1a;
    --caption-color: #2a5c1a;
    --slider-accent: #2f8f4e;
    --btn-bg: #1f4d38;
    --btn-color: #f0f7e8;
    --meter-border: #a8cc90;
  }
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }

body {
  background: var(--page-bg);
  font-family: system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 0 0;
  gap: 0;
}

.page-title {
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(15px, 2.2vw, 20px);
  font-weight: 700;
  color: #1f4d38;
  text-align: center;
  letter-spacing: .04em;
  margin-bottom: 14px;
  max-width: 1000px;
  width: 100%;
}

.card {
  background: var(--card-bg);
  border-radius: 0;
  box-shadow: none;
  border: none;
  max-width: 1000px;
  width: 100%;
  overflow: hidden;
}

svg#scene {
  display: block;
  width: 100%;
  height: auto;
}

</style>
</head>
<body>

<p class="page-title">Inside the pond floor: where toxins are born</p>

<div class="card">
  <svg id="scene" viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" aria-label="Animated cross-section of a shrimp pond floor">
    <defs>
      <!-- Water gradient -->
      <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#c8e8f8"/>
        <stop offset="100%" stop-color="#7bbedd"/>
      </linearGradient>
      <!-- Sediment gradient -->
      <linearGradient id="gSed" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#6b4c36"/>
        <stop offset="100%" stop-color="#4a3222"/>
      </linearGradient>
      <!-- Glow filter (soft) -->
      <filter id="fGlow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="7" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <!-- Clip to scene -->
      <clipPath id="cpScene">
        <rect x="0" y="0" width="1000" height="540"/>
      </clipPath>
    </defs>

    <g clip-path="url(#cpScene)">

      <!-- ── WATER COLUMN ── -->
      <rect id="rWater" x="0" y="0" width="1000" height="300" fill="url(#gWater)"/>
      <!-- murk overlay -->
      <rect id="rMurk" x="0" y="0" width="1000" height="300" fill="#8b5e36" opacity="0.03"/>
      <!-- stress overlay -->
      <rect id="rStress" x="0" y="0" width="1000" height="300" fill="#cc4f73" opacity="0"/>

      <!-- ── SEDIMENT ── -->
      <rect x="0" y="300" width="1000" height="240" fill="url(#gSed)"/>

      <!-- ── SOIL-WATER INTERFACE ── -->
      <rect x="0" y="294" width="1000" height="6" fill="#c9924e" opacity="0.9"/>
      <line x1="0" y1="322" x2="1000" y2="322" stroke="#c9924e" stroke-width="1"
            stroke-dasharray="8 7" opacity="0.45"/>

      <!-- ── STATIC ARROW: ammonia x=230 ── -->
      <line x1="230" y1="372" x2="230" y2="116" stroke="#b83a5b" stroke-width="2.5"/>
      <polygon points="230,96 223,116 237,116" fill="#b83a5b"/>

      <!-- ── STATIC ARROW: nitrite x=500 ── -->
      <line x1="500" y1="372" x2="500" y2="116" stroke="#b83a5b" stroke-width="2.5"/>
      <polygon points="500,96 493,116 507,116" fill="#b83a5b"/>

      <!-- ── STATIC ARROW: H2S x=770 ── -->
      <line x1="770" y1="372" x2="770" y2="116" stroke="#b83a5b" stroke-width="2.5"/>
      <polygon points="770,96 763,116 777,116" fill="#b83a5b"/>

      <!-- ── DYNAMIC LAYERS (populated by JS) ── -->
      <g id="gGlows"/>
      <g id="gParticles"/>
      <g id="gBubbles"/>
      <g id="gBacteria"/>
      <g id="gFish"/>

      <!-- ── LABELS ── -->
      <!-- Water column -->
      <text x="500" y="26" text-anchor="middle"
            font-family="'Courier New',Courier,monospace" font-size="12" font-weight="700"
            letter-spacing="2.5" fill="#1a4d35" opacity="0.85">WATER COLUMN · SHRIMP</text>

      <!-- Interface -->
      <text x="500" y="292" text-anchor="middle"
            font-family="'Courier New',Courier,monospace" font-size="10" font-weight="700"
            letter-spacing="1.8" fill="#3d2f1c" opacity="0.9">SOIL-WATER INTERFACE · THIN OXIDISED LAYER</text>

      <!-- Sediment -->
      <text x="500" y="526" text-anchor="middle"
            font-family="'Courier New',Courier,monospace" font-size="11" font-weight="700"
            letter-spacing="2" fill="#b98446" opacity="0.9">ANAEROBIC SEDIMENT · NO OXYGEN</text>

      <!-- Toxin labels -->
      <text x="230" y="70" text-anchor="middle"
            font-family="'Courier New',Courier,monospace" font-size="11" font-weight="700"
            letter-spacing="1.4" fill="#b83a5b" opacity="0.9">NH₃ · ammonia</text>
      <text x="500" y="70" text-anchor="middle"
            font-family="'Courier New',Courier,monospace" font-size="11" font-weight="700"
            letter-spacing="1.4" fill="#b83a5b" opacity="0.9">NO₂⁻ · nitrite</text>
      <text x="770" y="70" text-anchor="middle"
            font-family="'Courier New',Courier,monospace" font-size="11" font-weight="700"
            letter-spacing="1.4" fill="#b83a5b" opacity="0.9">H₂S · hydrogen sulphide</text>

      <!-- Sediment serif labels -->
      <text x="230" y="376" text-anchor="middle"
            font-family="Georgia,serif" font-size="15" fill="rgba(255,255,255,0.72)">Organic N → ammonia</text>
      <text x="500" y="420" text-anchor="middle"
            font-family="Georgia,serif" font-size="15" fill="rgba(255,255,255,0.72)">Incomplete nitrification</text>
      <text x="770" y="376" text-anchor="middle"
            font-family="Georgia,serif" font-size="15" fill="rgba(255,255,255,0.72)">Sulphate-reducing bacteria</text>

      <!-- Bottom corner bacteria labels -->
      <text x="40" y="470" text-anchor="start"
            font-family="'Courier New',Courier,monospace" font-size="10" font-weight="700"
            letter-spacing="1.6" fill="#6fcfa0" opacity="0.9">ANAEROBIC CONSORTIA</text>
      <text x="40" y="484" text-anchor="start"
            font-family="Georgia,serif" font-size="11" fill="#6fcfa0" opacity="0.6">digest the organic load</text>

      <text x="960" y="470" text-anchor="end"
            font-family="'Courier New',Courier,monospace" font-size="10" font-weight="700"
            letter-spacing="1.6" fill="#6fcfa0" opacity="0.9">DENITRIFIERS · SULPHIDE OXIDISERS</text>
      <text x="960" y="484" text-anchor="end"
            font-family="Georgia,serif" font-size="11" fill="#6fcfa0" opacity="0.6">N → N₂ gas · H₂S → sulphur</text>

      <!-- Top-left settle label -->
      <text x="18" y="112" text-anchor="start"
            font-family="Georgia,serif" font-size="14" fill="#1f4a63" opacity="0.75">Feed, faeces, dead plankton</text>
      <text x="18" y="130" text-anchor="start"
            font-family="Georgia,serif" font-size="14" fill="#1f4a63" opacity="0.75">settle daily</text>

    </g><!-- /clip -->
  </svg>

</div>

<script>
(function(){
"use strict";

/* ── Helpers ── */
function rnd(a,b){ return a + Math.random()*(b-a); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function lerp(a,b,t){ return a+(b-a)*t; }

/* ── State ── */
var load   = 0.55;   // 0-1
var stress = 0;      // 0-1 smoothed
var lastT  = null;

/* ── SVG helpers ── */
var NS = "http://www.w3.org/2000/svg";
function el(tag, attrs){
  var e = document.createElementNS(NS, tag);
  for(var k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

/* ── Layer groups ── */
var gGlows     = document.getElementById("gGlows");
var gParticles = document.getElementById("gParticles");
var gBubbles   = document.getElementById("gBubbles");
var gBacteria  = document.getElementById("gBacteria");
var gFish      = document.getElementById("gFish");
var rMurk      = document.getElementById("rMurk");
var rStress    = document.getElementById("rStress");

/* ══════════════════════════════════════════
   GLOWS — three soft radial blobs under lanes
══════════════════════════════════════════ */
var glowLanes = [230, 500, 770];
var glowEls = glowLanes.map(function(x){
  var r = el("ellipse",{
    cx: x, cy: 338,
    rx: 60, ry: 28,
    fill: "#cc4f73",
    opacity: 0
  });
  gGlows.appendChild(r);
  return r;
});
var glowPhase = 0;

/* ══════════════════════════════════════════
   BACTERIA CLUSTERS
══════════════════════════════════════════ */
var bacteriaData = [
  { cx:70,  cy:430 },
  { cx:870, cy:425 }
];
// Each cluster: 7 capsules
var bacteriaClusters = bacteriaData.map(function(c){
  var g = el("g",{});
  var caps = [];
  var offsets = [
    [-22,-12], [-6,-18], [10,-14], [22,-4],
    [-16,6],   [4,10],   [18,4]
  ];
  offsets.forEach(function(o){
    var r = el("rect",{
      x: c.cx + o[0] - 9,
      y: c.cy + o[1] - 5,
      width: 18, height: 10,
      rx: 5, ry: 5,
      fill: "none",
      stroke: "#6fcfa0",
      "stroke-width": 1.5,
      opacity: 0.85
    });
    g.appendChild(r);
    caps.push(r);
  });
  gBacteria.appendChild(g);
  return { g:g, caps:caps, cx:c.cx, cy:c.cy, phase: Math.random()*Math.PI*2 };
});

/* ══════════════════════════════════════════
   FISH
══════════════════════════════════════════ */
function makeFish(id, x, y, scl, baseY){
  var g = el("g",{});

  // body ellipse
  var body = el("ellipse",{ cx:0, cy:0, rx:26*scl, ry:10*scl,
    fill:"#8a9a8f", stroke:"none" });
  // tail
  var tail = el("polygon",{
    points: [-26*scl+","+(-7*scl), (-26*scl-14*scl)+","+(-12*scl),
             (-26*scl-14*scl)+","+(12*scl), (-26*scl)+","+(7*scl)].join(" "),
    fill:"#6f8077"
  });
  // dorsal fin
  var dorsal = el("polygon",{
    points: [(-2*scl)+","+(-10*scl), (8*scl)+","+(-18*scl),
             (16*scl)+","+(-10*scl)].join(" "),
    fill:"#6f8077"
  });
  // pectoral fin
  var pec = el("ellipse",{ cx:5*scl, cy:4*scl, rx:9*scl, ry:4*scl,
    fill:"#6f8077", opacity:0.7 });
  // eye
  var eye = el("circle",{ cx:20*scl, cy:-2*scl, r:2.2*scl, fill:"#1a2820" });
  // gill line
  var gill = el("line",{
    x1:12*scl, y1:-8*scl, x2:10*scl, y2:8*scl,
    stroke:"#5a6e62", "stroke-width":1.2*scl, opacity:0.6
  });

  g.appendChild(tail);
  g.appendChild(dorsal);
  g.appendChild(pec);
  g.appendChild(body);
  g.appendChild(gill);
  g.appendChild(eye);
  gFish.appendChild(g);

  return {
    g:g, body:body, tail:tail,
    x:x, y:y, baseY:baseY,
    vx: rnd(18,30)*(Math.random()<0.5?1:-1),
    vy: 0,
    scaleX: 1,
    targetScaleX: 1,
    bobPhase: Math.random()*Math.PI*2,
    tailPhase: Math.random()*Math.PI*2,
    scl:scl,
    stressY:0
  };
}

var fish = [
  makeFish(0, 200, 165, 1.0,  165),
  makeFish(1, 520, 200, 0.85, 200),
  makeFish(2, 760, 180, 1.1,  180)
];

/* ══════════════════════════════════════════
   PARTICLES (settling feed)
══════════════════════════════════════════ */
var particles = [];
var pSpawnAcc = 0;

function spawnParticle(){
  var r = rnd(1.8, 3.6);
  var c = el("circle",{
    cx: rnd(40, 960),
    cy: -r-2,
    r:  r,
    fill: "#a8815a",
    opacity: rnd(0.55,0.9)
  });
  gParticles.appendChild(c);
  particles.push({
    el:c, x: parseFloat(c.getAttribute("cx")), y: -r-2,
    r:r,
    vy: rnd(30,65), vx: rnd(-6,6),
    drift: rnd(-0.4,0.4),
    phase: Math.random()*Math.PI*2
  });
}

/* ══════════════════════════════════════════
   BUBBLES (toxin)
══════════════════════════════════════════ */
var bubbles = [];
var bSpawnAcc = [0,0,0];
var bLaneX    = [230, 500, 770];
var bSpawnBase= [6,   4,   5  ]; // per second base

function spawnBubble(laneIdx){
  var x0 = bLaneX[laneIdx] + rnd(-45,45);
  var y0 = rnd(310,380);
  var r  = rnd(3,6);
  var c  = el("circle",{
    cx:x0, cy:y0, r:r,
    fill:"none",
    stroke:"#cc4f73",
    "stroke-width":1.6,
    opacity:0.85
  });
  gBubbles.appendChild(c);
  bubbles.push({
    el:c, x:x0, y:y0, r:r,
    vy: rnd(35,70),
    sway: rnd(6,10),
    swaySpeed: rnd(0.8,1.6),
    phase: Math.random()*Math.PI*2,
    lane: laneIdx
  });
}

/* ══════════════════════════════════════════
   UPDATE
══════════════════════════════════════════ */
function update(dt){
  var t = performance.now()/1000;

  /* ── particles ── */
  pSpawnAcc += (2 + load*10) * dt;
  while(pSpawnAcc >= 1){ pSpawnAcc--; spawnParticle(); }

  for(var i = particles.length-1; i >= 0; i--){
    var p = particles[i];
    p.phase += dt;
    p.x += p.vx*dt + Math.sin(p.phase*0.7)*p.drift;
    p.y += p.vy*dt;
    var op = 1;
    if(p.y > 300) op = clamp(1-(p.y-300)/72, 0, 1);
    p.el.setAttribute("cx", p.x.toFixed(1));
    p.el.setAttribute("cy", p.y.toFixed(1));
    p.el.setAttribute("opacity", (parseFloat(p.el.getAttribute("opacity"))*0.6 + op*0.4).toFixed(3));
    if(p.y > 372){ gParticles.removeChild(p.el); particles.splice(i,1); }
  }

  /* ── bubbles ── */
  var inWater = 0;
  for(var li=0; li<3; li++){
    bSpawnAcc[li] += bSpawnBase[li] * 1.4 * load * dt;
    while(bSpawnAcc[li] >= 1){ bSpawnAcc[li]--; spawnBubble(li); }
  }
  for(var i = bubbles.length-1; i >= 0; i--){
    var b = bubbles[i];
    b.phase += dt * b.swaySpeed;
    b.x += Math.sin(b.phase) * b.sway * dt;
    b.y -= b.vy * dt;
    var op = 0.85;
    if(b.y < 300) {
      op = clamp(0.85 - (300-b.y)/215 * 0.78, 0.05, 0.85);
      inWater++;
    }
    b.el.setAttribute("cx", b.x.toFixed(1));
    b.el.setAttribute("cy", b.y.toFixed(1));
    b.el.setAttribute("opacity", op.toFixed(3));
    if(b.y < 85){ gBubbles.removeChild(b.el); bubbles.splice(i,1); }
  }

  /* ── stress ── */
  var rawStress = clamp(inWater/38, 0, 1);
  stress = lerp(stress, rawStress, clamp(dt*1.4, 0, 1));

  /* ── murk / stress overlays ── */
  rMurk.setAttribute("opacity",  (0.01 + load*0.07).toFixed(3));
  rStress.setAttribute("opacity",(stress*0.04).toFixed(3));

  /* ── glows ── */
  glowPhase += dt * 0.55;
  glowEls.forEach(function(g, i){
    var pulse = 0.5 + 0.5*Math.sin(glowPhase + i*1.1);
    var op = load * 0.22 * pulse;
    g.setAttribute("opacity", op.toFixed(3));
  });

  /* ── bacteria ── */
  bacteriaClusters.forEach(function(cl){
    cl.phase += dt * 0.45;
    var sc = 1 + 0.12*Math.sin(cl.phase);
    var glow = 0.7 + load * 0.28;
    cl.caps.forEach(function(cap, j){
      var s = sc * (1 + 0.04*Math.sin(cl.phase + j*0.7));
      cap.setAttribute("opacity", (glow * 0.85).toFixed(3));
      cap.setAttribute("transform",
        "translate("+cl.cx+","+cl.cy+") scale("+s.toFixed(4)+") translate("+(-cl.cx)+","+(-cl.cy)+")");
    });
  });

  /* ── fish ── */
  fish.forEach(function(f){
    // stress sink
    var targetSinkY = stress * 40;
    f.stressY = lerp(f.stressY, targetSinkY, dt*0.6);

    // body color shift under stress
    var bodyCol = stress > 0.55 ? "#9a9582" : "#8a9a8f";
    f.body.setAttribute("fill", bodyCol);
    f.tail.setAttribute("fill", stress > 0.55 ? "#82836c" : "#6f8077");

    // speed
    var spd = 1 + stress*0.35;
    f.x += f.vx * spd * dt;
    f.bobPhase  += dt * 0.9;
    f.tailPhase += dt * 2.2;

    // bob
    var bob = Math.sin(f.bobPhase) * 5;

    // turn at edges
    if(f.vx > 0 && f.x > 950){ f.vx = -Math.abs(f.vx); f.targetScaleX = -1; }
    if(f.vx < 0 && f.x < 50 ){ f.vx =  Math.abs(f.vx); f.targetScaleX =  1; }
    f.scaleX = lerp(f.scaleX, f.targetScaleX, dt*4);

    // tail wag
    var tailRot = Math.sin(f.tailPhase) * 12;
    f.tail.setAttribute("transform","rotate("+tailRot.toFixed(2)+",0,0)");

    var fy = f.baseY + bob + f.stressY;
    var tilt = clamp(f.vx * 0.15, -6, 6);
    f.g.setAttribute("transform",
      "translate("+f.x.toFixed(1)+","+fy.toFixed(1)+")"
      +" scale("+f.scaleX.toFixed(3)+",1)"
      +" rotate("+tilt.toFixed(2)+")");
  });

}

/* ══════════════════════════════════════════
   RAF LOOP
══════════════════════════════════════════ */
function loop(now){
  requestAnimationFrame(loop);
  if(lastT === null){ lastT = now; }
  var dt = clamp((now - lastT)/1000, 0, 0.05);
  lastT = now;
  update(dt);
}
requestAnimationFrame(loop);

})();
</script>

<script>
(function() {

్థిరపడే బ్యాక్టీరియా ఆంత్రము పొర ఎలా అభివృద్ధి చెందుతుందో, రోగ నిరోధక వ్యవస్థ ఎలా పరిపక్వమవుతుందో, ఎలాంటి పాథోజెన్లు అంటుకునే అవకాశం పొందుతాయో నిర్ణయిస్తాయి.","fc_p2_lead":"ఈ ఆలోచనకు 50 సంవత్సరాల చరిత్ర ఉంది.","fc_p2_body":"1973లో, Nurmi మరియు Rantala ఆరోగ్యకరమైన పెద్ద కోడిపిట్టల ఆంత్రము బ్యాక్టీరియా ఇవ్వబడిన ఒక్కరోజు వయస్సు చిక్కులు Salmonella కాలనైజేషన్‌కు ప్రతిఘటించాయని చూపించారు. దీన్ని పోటీ మినహాయింపు (competitive exclusion) అని పిలిచారు.","pgl_page_label":"ఆంత్రము పునరుద్ధరణ మరియు వ్యాధి నిర్వహణ","pgl_page_title":"ప్రొబయోటిక్స్ సరైన బ్యా���్టీరియాను తీసుకువస్తాయి. ప్రీబయోటిక్స్ వాటిని అక్కడే ఉంచుతాయి.","pgl_col1_label":"ప్రొబయోటిక్స్: జీవ హితకర బ్యాక్టీరియా","pgl_col1_title":"అవి ఆంత్రమును ఎలా రక్షిస్తాయో","pgl_col2_label":"ప్రీబయోటిక్స్: మంచి బ్యాక్టీరియాకు ఆహారం","pgl_col2_title":"అవి సముదాయాన్ని ఎలా ఆకృతీకరిస్తాయో","pgl_r1_left_title":"ప్రతిస్పర్ధాత్మక బహిష్కరణ:","pgl_r1_left_body":"లాభదాయకమైన బ్యాక్టీరియా, Salmonella, E. coli మరియు Clostridium కు అవసరమైన అంటుకునే ప్రదేశాలు మరియు పోషకాలను ఆక్రమిస్తాయి.","pgl_r1_right_title":"ఎంచుకున్న ఆహారం:","pgl_r1_right_body":"mannan- మరియు fructo-oligosaccharides వంటి ఫైబర్లు జీర్ణం కాకుండా దిగువ ప్రేగులోకి చేరుతాయి, అక్కడ లాభదాయకమైన బ్యాక్టీరియా వాటిని ఫర్మెంట్ చేస్తాయి.","pgl_r2_left_title":"ప్రతిజీవి సమ్మేళనాలు:","pgl_r2_left_body":"Bacillus మరియు lactic acid బ్యాక్టీరియా నేరుగా రోగకారకాలను నిరోధించే పదార్థాలను ఉత్పత్తి చేస్తాయి.","pgl_r2_right_title":"రోగకారక బైండింగ్:","pgl_r2_right_body":"Mannan-oligosaccharides (MOS) కొన్ని బ్యాక్టీరియా అంటుకునేందుకు ఉపయోగించే fimbriae కు బైండ్ అవుతాయి, అందువల్ల ఆ బ్యాక్టీరియా కాలనైజ్ కాకుండా బయటకు వెళ్ళిపోతాయి.","pgl_r3_left_title":"బలమైన ప్రేగు పొర:","pgl_r3_left_body":"ఆరోగ్యకరమైన సముదాయం పొడవైన విల్లి మరియు ప్రేగు కణాల మధ్య బలమైన జంక్షన్లను కలిగి ఉండేలా సహాయపడుతుంది, అందువల్ల తక్కువ రోగకారకాలు మరియు విషాలు లోపలికి చేరతాయి.","pgl_r3_right_title":"చిన్న గొలుసు కొవ్వు ఆమ్లాలు:","pgl_r3_right_body":"ఫర్మెంటేషన్ ద్వారా ఆమ్లాలు ఉత్పత్తి అవుతాయి, ఇవి ప్రేగు pH ను తగ్గిస్తాయి, ప్రేగు కణాలను పోషిస్తాయి మరియ��� రోగకారకాలను నిరుత్సాహపరుస్తాయి.","pgl_r4_left_title":"దృఢమైన స్పోర్లు:","pgl_r4_left_body":"Bacillus స్పోర్లు వేడి మరియు కడుపు ఆమ్లాన్ని చాలా బ్యాక్టీరియా కన్నా మెరుగుగా తట్టుకోగలవు, ఇది వాటిని ఫీడ్ ప్రాసెసింగ్ లో మరియు ప్రేగులోకి చేరడంలో సహాయపడుతుంది.","pgl_r4_right_title":"సింబయోటిక్ ప్రభావం:","pgl_r4_right_body":"ప్రొబయోటిక్ మరియు ప్రీబయోటిక్ కలిపి ఇచ్చినప్పుడు పరస్పరం బలపరిచుకుంటాయి.","pgl_evidence_title":"ప్రీబయోటిక్ ఆధారం: broilers లో mannan-oligosaccharide","pgl_evidence_sub":"పూల్ చేసిన పెన్ ప్రయోగాలు, MOS ను యాంటీబయోటిక్స్ లేని ఆహారంతో పోల్చారు.","pgl_ev_label1":"మరణాలు","pgl_ev_label2":"శరీర బరువు","pgl_ev_label3":"ఫీడ్ కన్వర్షన్ రేషియో","pmb_headline1":"ఖనిజాలను విడుదల చేయడం","pmb_headline2":"ఇప్పటికే ఫీడ్‌లో ఉన్నవి.","pmb_lead":"ధాన్యం మరియు ఆయిల్‌సీడ్ మీల్‌లోని ఎక్కువ భాగం ఫాస్ఫరస్ phytate అనే సమ్మేళనంలో బంధించబడి ఉంటుంది, దీన్ని పక్షులు సరిగా విచ్ఛిన్నం చేయలేవు. phytate కాల్షియం, జింక్ మరియు ఐరన్‌ను కూడా బంధిస్తుంది. రైతులు ఖనిజాలకు రెండుసార్లు ఖర్చు చేస్తారు: ఒకసారి ధాన్యంలో, మరొకసారి పక్షి ఉపయోగించలేనిది పూరించేందుకు సప్లిమెంట్ల రూపంలో.","pmb_exp1":"కాలేయంలో ఉన్న ఖనిజాలను కరిగించే బ్యాక్టీరియా phytase ఎంజైములను ఉత్పత్తి చేస్తాయి, ఇవి phytate ను విడదీస్తాయి, అలాగే కాల్షియం మరియు ఇతర ఖనిజాలు కరిగిన రూపంలో ఉండేందుకు సహాయపడే ఆర్గానిక్ యాసిడ్లను ఉత్పత్తి చేస్తాయి. పక్షి అదే ఫీడ్ నుండి ఎక్కువగా పొందుతుంది, మరియు తక్కువ ఫాస్ఫరస్ లిటర్ మరియు నేలలోకి చేరుతుంది.","pmb_exp2":"ఇది సూత్రప్రాయంగా నిరూపించబడింది: ఫాస్ఫరస్ తక్కువగా ఉన్న ఆహారం తీసుకున్న బ్రాయిలర్లకు phytase ఉత్పత్తి చేసే Lactobacillus స్ట్రెయిన్లు ఇచ్చినప్పుడు, అవి తగిన ఫాస్ఫరస్ ఉన్న ఆహారం తీసుకున్న పక్షులతో సమానంగా పెరిగాయి.","pmb_meter_title":"ఫీడ్ ఫాస్ఫరస్ ఎక్కడ బంధించబడి ఉంది","pmb_meter_sub":"phytate రూపంలో మరియు ఇతర రూపాల్లో ఉన్న మొత్తం ఫాస్ఫరస్ వాటా.","pmb_corn_label":"మక్క","pmb_corn_value":"72% phytate","pmb_soy_label":"సోయాబీన్ మీల్","pmb_soy_value":"60% phytate","pmb_legend_bound":"phytate లో బంధించబడి ఉంది","pmb_legend_other":"ఇతర రూపాలు","pmb_p_title":"phytate నుండి విడుదల","pmb_p_copy":"phytate సోయాబీన్ మీల్ మరియు మక్కలో 60–72% ఫాస్ఫరస్‌ను బంధిస్తుంది.","pmb_ca_title":"షెల్ మరియు ఎముక","pmb_ca_copy":"ప్రొబయోటిక్స్ లేయింగ్ హెన్స్‌లో గుడ్డు షెల్ మందాన్ని మరియు బరువును పెంచాయి.","pmb_znfe_title":"బంధన నుండి విడుదల","pmb_znfe_copy":"phytate ను విచ్ఛిన్నం చేయడం ద్వారా అది బంధించిన ట్రేస్ ఖనిజాలు కూడా విడుదల అవుతాయి.","pmb_source":"ఈ పదార్థాలలో ఉన్న ఫాస్ఫరస్‌లో కేవలం 10–30% మాత్రమే కోళ్లు ఉపయోగించగలవు. మూలం: మిసిసిప్పి స్టేట్ యూనివర్శిటీ ఎక్స్‌టెన్షన్. చూపించిన నిష్పత్తులు ఉదాహరణ కోసం మాత్రమే, కొలిచిన ఫలితాలు కావు.","pf_title":"పొండులో నేలలోపల: విషాలు పుట్టే చోటు","pf_water_col":"నీటి పరిమాణం · రొయ్యలు","pf_interface":"నేల-నీటి అంతరము · పలుచని ఆక్సీకరణ పొర","pf_sediment":"అనారోబిక్ అవక్షేపం · ఆక్సిజన్ లేదు","pf_organic_n":"ఆర్గానిక్ N → అమోనియా","pf_nitrif":"అపూర్ణ నైట్రిఫికేషన్","pf_sulphate":"సల్ఫేట్-రెడ్యూసింగ్ బ్యాక్టీరియా","pf_anaerobic":"అనారోబిక్ సమూహాలు","pf_digest":"సేంద్రియ లోడును జీర్ణించటం","pf_denitrifiers":"డీనైట్రిఫయర్స్ · సల్ఫైడ్ ఆక్సిడైజర్స్","pf_n2":"N → N₂ వాయువు · H₂S → సల్ఫర్","pf_settle1":"ఫీడ్, విసర్జన, మృత ప్లాంక్టన్","pf_settle2":"ప్రతి రోజు కింద పడతాయి","ms_low_salinity":"తక్కువ ఉప్పుతనం లో జీవించటం","ms_why_minerals":"ఖనిజాలు ఎందుకు అవసరం","ms_survival_rate":"జీవిత రేటు","ms_without_minerals":"ఖనిజాలు లేకుండా","ms_with_minerals":"ఖనిజాలతో"},"hi":{"sgh_eyebrow":"झींगा के अंदर","sgh_headline1":"एक स्वस्थ आंत है","sgh_headline2":"रोग प्रतिरोध की पहली पंक्ति।","sgh_lede":"रोग ट्रॉपिकल झींगा पालन में हर साल उत्पादन का 40% तक नुकसान पहुंचाते हैं। कई बैक्टीरियल रोग, जिनमें Vibrio संक्रमण जैसे AHPND शामिल हैं, आंत में उपनिवेश बनाकर शुरू होते हैं। प्रोबायोटिक्स लाभकारी बैक्टीरिया जोड़ते हैं। प्रीबायोटिक्स उन्हें पोषण देते हैं। साथ मिलकर वे एक ऐसी आंत समुदाय को पुनर्स्थापित करते हैं जो रोगजनकों का विरोध करती है और अधिक चारे को वृद्धि में बदलती है।","sgh_diag_eyebrow":"झींगा मिडगट · क्रॉस-सेक्शन","sgh_diag_caption":"मिडगट योजनात्मक चित्र · स्केल पर नहीं","sgh_leg1":"प्रोबायोटिक्स आंत की दीवार पर पंक्तिबद्ध होते
